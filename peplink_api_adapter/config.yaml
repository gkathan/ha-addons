name: "Peplink API Adapter"
version: "v0.2.0"
slug: "peplink_api_adapter"
description: "Generic read-only Peplink 8.6.x API to MQTT Discovery adapter"
url: "https://github.com/gkathan/ha-addons"
startup: application
boot: auto
init: false

arch:
  - aarch64
  - amd64

image: "ghcr.io/gkathan/peplink-ha-adapter"

options:
  router_host: ""
  client_id: ""
  client_secret: ""
  verify_ssl: false
  poll_interval: 30
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  device_id: "peplink_router"
  sim_enabled: false
  sim_slot_sim_a_name: "SIM A"
  sim_slot_sim_b_name: "SIM B"
  sim_slot_esim_a_name: "eSIM A"
  sim_slot_esim_b_name: "eSIM B"

schema:
  router_host: str
  client_id: str
  client_secret: password
  verify_ssl: bool
  poll_interval: int(10,3600)
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  device_id: str
  sim_enabled: bool
  sim_slot_sim_a_name: str
  sim_slot_sim_b_name: str
  sim_slot_esim_a_name: str
  sim_slot_esim_b_name: str
